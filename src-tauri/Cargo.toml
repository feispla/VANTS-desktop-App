[package]
name = "vantcall-desktop"
version = "0.1.0"
description = "Cliente de escritorio competitivo para la plataforma VANTCALL"
authors = ["VANTCALL"]
repository = "https://github.com/feispla/vantcall-desktop-App"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.2", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.2", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.2", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[profile.dev.package.scrypt]
opt-level = 3
